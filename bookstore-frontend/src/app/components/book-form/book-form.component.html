<div class="container mt-4" style="max-width: 600px;">
  <h2>{{ bookId ? 'Editar' : 'Añadir' }} Libro</h2>
  
  @if (loading) {
    <div class="spinner-border text-primary my-3" role="status"></div>
  }

  @if (!loading) {
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label>Título</label>
        <input type="text" class="form-control" formControlName="title" [class.is-invalid]="bookForm.get('title')?.invalid && bookForm.get('title')?.touched">
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Autor</label>
          <input type="text" class="form-control" formControlName="author">
        </div>
        <div class="col-md-6 mb-3">
          <label>ISBN (10 o 13 dígitos)</label>
          <input type="text" class="form-control" formControlName="isbn" [class.is-invalid]="bookForm.get('isbn')?.invalid && bookForm.get('isbn')?.touched">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Costo (USD)</label>
          <input type="number" step="0.01" class="form-control" formControlName="cost_usd" [class.is-invalid]="bookForm.get('cost_usd')?.invalid && bookForm.get('cost_usd')?.touched">
        </div>
        <div class="col-md-6 mb-3">
          <label>Stock</label>
          <input type="number" class="form-control" formControlName="stock_quantity" [class.is-invalid]="bookForm.get('stock_quantity')?.invalid && bookForm.get('stock_quantity')?.touched">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Categoría</label>
          <input type="text" class="form-control" formControlName="category">
        </div>
        <div class="col-md-6 mb-3">
          <label>País Proveedor (Ej: ES)</label>
          <input type="text" class="form-control" formControlName="supplier_country" maxlength="2">
        </div>
      </div>

      <button type="submit" class="btn btn-primary me-2" [disabled]="bookForm.invalid">Guardar</button>
      <button type="button" class="btn btn-secondary" routerLink="/books">Cancelar</button>
    </form>
  }
</div>
